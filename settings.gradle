pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'OpenDialer'

include(
        // core
        ":core:aosp",
        ":core:common",

        // data
        ":data:calls",
        ":data:callsCache",
        ":data:contacts",
        ":data:contactsSearch",
        ":data:voicemail",

        // features
        ":feature:callDetail",
        ":feature:calls",
        ":feature:contacts",
        ":feature:contactsSearch",
        ":feature:inCall",
        ":feature:appShell",
        ":feature:settings",
        ":feature:voicemail",

        // app
        ":app",
)
