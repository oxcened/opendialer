[versions]
agp = "9.3.1"
kotlin = "2.2.10"
hilt = "2.57.2"
androidx-core = "1.12.0"
androidx-appcompat = "1.6.1"
material = "1.10.0"
junit = "4.13.2"
androidx-test-ext = "1.2.1"
androidx-espresso = "3.5.1"
androidx-lifecycle = "2.6.2"
androidx-lifecycle-extensions = "2.2.0"
