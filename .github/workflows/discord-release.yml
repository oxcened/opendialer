name: Discord Release Notification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to announce
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Build Discord payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PAYLOAD_PATH: ${{ runner.temp }}/discord-release-payload.json
        run: |
          set -o pipefail
          gh release view "$RELEASE_TAG" --json name,tagName,url,body | jq '
            .tagName as $tag
            | ($tag | test("^v?[0-9]+\\.[0-9]+\\.0$")) as $is_major_or_minor
            | (if $is_major_or_minor then "@everyone\n" else "" end) as $mention
            | (.name // $tag) as $release_name
            | (.body // "") as $notes
            | {
                content: ($mention + "A new release of OpenDialer is available!"),
                allowed_mentions: {
                  parse: (if $is_major_or_minor then ["everyone"] else [] end)
                },
                embeds: [
                  ({
                    title: ("OpenDialer " + $release_name),
                    url: .url,
                    fields: [
                      {
                        name: "Tag",
                        value: $tag,
                        inline: true
                      }
                    ]
                  }
                  + (if $notes == "" then {} else {description: $notes[0:4096]} end))
                ]
              }
          ' > "$PAYLOAD_PATH"

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD_PATH: ${{ runner.temp }}/discord-release-payload.json
        run: |
          test -n "$DISCORD_WEBHOOK"
          curl --fail --silent --show-error --location \
            --header "Content-Type: application/json" \
            --data-binary "@$PAYLOAD_PATH" \
            "$DISCORD_WEBHOOK"
