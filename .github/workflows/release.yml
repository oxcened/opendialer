name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Validate tag and build signed release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew validateReleaseVersion assembleRelease

      - name: Package release assets and checksum
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset_directory="$RUNNER_TEMP/release"
          mkdir -p "$asset_directory"
          apk_name="OpenDialer-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset_directory/$apk_name"
          (
            cd "$asset_directory"
            sha256sum "$apk_name" > "$apk_name.sha256"
          )
          echo "directory=$asset_directory" >> "$GITHUB_OUTPUT"
          echo "apk=$asset_directory/$apk_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$asset_directory/$apk_name.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.assets.outputs.directory }}/*

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_APK: ${{ steps.assets.outputs.apk }}
          RELEASE_CHECKSUM: ${{ steps.assets.outputs.checksum }}
        run: gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_CHECKSUM" --generate-notes --verify-tag

      - name: Build Discord payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PAYLOAD_PATH: ${{ runner.temp }}/discord-release-payload.json
        run: |
          gh release view "$RELEASE_TAG" --json name,tagName,url,body | jq '
            .tagName as $tag
            | ($tag | test("^v?[0-9]+\\.[0-9]+\\.0$")) as $is_major_or_minor
            | (if $is_major_or_minor then "@everyone\n" else "" end) as $mention
            | (.name // $tag) as $release_name
            | (.body // "") as $notes
            | {
                content: ($mention + "A new release of OpenDialer is available!"),
                allowed_mentions: {
                  parse: (if $is_major_or_minor then ["everyone"] else [] end)
                },
                embeds: [
                  ({
                    title: ("OpenDialer " + $release_name),
                    url: .url,
                    fields: [
                      {
                        name: "Tag",
                        value: $tag,
                        inline: true
                      }
                    ]
                  }
                  + (if $notes == "" then {} else {description: $notes[0:4096]} end))
                ]
              }
          ' > "$PAYLOAD_PATH"

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD_PATH: ${{ runner.temp }}/discord-release-payload.json
        run: |
          test -n "$DISCORD_WEBHOOK"
          curl --fail --silent --show-error --location \
            --header "Content-Type: application/json" \
            --data-binary "@$PAYLOAD_PATH" \
            "$DISCORD_WEBHOOK"
